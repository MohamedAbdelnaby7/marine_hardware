services:
  estop:
    build: .
    container_name: estop
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./config.yml:/app/config.yml:ro
      - /dev:/dev
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"